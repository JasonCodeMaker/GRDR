subsampling: {}
reading:
  yt_args:
    download_size: 360
    download_audio: false
    yt_metadata_args:
      writesubtitles: true
      subtitleslangs: ["en"]
      writeautomaticsub: true
      get_info: true
  timeout: 60
  sampler: null
storage:
  number_sample_per_shard: 100
  oom_shard_count: 5
  captions_are_subtitles: false
distribution:
  processes_count: 6
  thread_count: 4
  subjob_size: 10000
  distributor: "multiprocessing"
